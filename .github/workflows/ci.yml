name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: chainguard-actions/actions-setup-java@4abbff4c3bfc93084ea2ff1796c8b4e0c255e47d # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile and package
        run: |
          javac --release 21 -d out $(find src -name '*.java')
          jar --create --file app.jar --main-class digest.App -C out .

      - uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: app-jar
          path: app.jar

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Build image
        env:
          TAG: ${{ github.sha }}
        run: docker build -t "supply-chain-digest:$TAG" .

      - name: Smoke test
        env:
          TAG: ${{ github.sha }}
        run: |
          docker run -d --name scd -p 8080:8080 "supply-chain-digest:$TAG"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 1
          done
          docker logs scd
          exit 1
