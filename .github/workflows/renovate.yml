name: Renovate

# Scheduled runs are skipped until the RENOVATE_ENABLED repository variable is
# set to "true" and a RENOVATE_TOKEN secret exists.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    if: github.event_name == 'workflow_dispatch' || vars.RENOVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
