name: Docs

on:
  push:
    branches: [main]
    paths: ['**.md', '.markdownlint-cli2.jsonc']
  pull_request:
    paths: ['**.md', '.markdownlint-cli2.jsonc']

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: chainguard-actions/pnpm-action-setup@c52d5dad1f53f21ac0284317f2432c499548f928 # v6.1.0
        with:
          version: 12

      - uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v7.1.0
        with:
          node-version: lts/*

      - name: Lint Markdown
        run: pnpm dlx markdownlint-cli2 '**/*.md'
