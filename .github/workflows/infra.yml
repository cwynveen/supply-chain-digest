name: Infra

on:
  push:
    branches: [main]
    paths: ['infra/**', 'charts/**', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infra/**', 'charts/**', '.github/workflows/infra.yml']

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: chainguard-actions/hashicorp-setup-terraform@33b7c5b436b982d28e819b644c84aa9f63c324f4 # v4.0.1

      - uses: chainguard-actions/terraform-linters-setup-tflint@d19ef8102ff37fd69bb87a540f22c6eaa9399730 # v6.3.2

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

      - name: Lint
        run: |
          tflint --init
          tflint

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint and render chart
        run: |
          helm lint charts/supply-chain-digest
          helm template scd charts/supply-chain-digest > /dev/null
