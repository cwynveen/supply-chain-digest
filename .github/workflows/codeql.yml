name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: chainguard-actions/github-codeql-action/init@fb4cd6516f031c131efd4b91cb7a4ab5975a11ae # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: chainguard-actions/github-codeql-action/analyze@fb4cd6516f031c131efd4b91cb7a4ab5975a11ae # v4.39.1
        with:
          category: /language:${{ matrix.language }}
