name: Deploy

# Builds the image and pushes it to Amazon ECR. Run manually after setting the
# AWS_ROLE_ARN and AWS_REGION repository variables (GitHub OIDC role).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/supply-chain-digest:$TAG" .
          docker push "$REGISTRY/supply-chain-digest:$TAG"
