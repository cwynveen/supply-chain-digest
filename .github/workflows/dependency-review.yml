name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: chainguard-actions/actions-dependency-review-action@9734438463c5dfd5ea001f1c5735d88042eba9de # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
