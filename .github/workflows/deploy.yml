name: Deploy

# Builds the image and pushes it to Amazon ECR. Run manually after setting the
# AWS_ROLE_ARN and AWS_REGION repository variables (GitHub OIDC role).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - uses: chainguard-actions/aws-actions-configure-aws-credentials@40d7afa2fc5b5040af4475d2b185cfd2e3e8ab9d # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: chainguard-actions/aws-actions-amazon-ecr-login@2bf61562ce1063a7d12126436c0a7e8c6149a0a5 # v2.1.7

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/supply-chain-digest:$TAG" .
          docker push "$REGISTRY/supply-chain-digest:$TAG"
